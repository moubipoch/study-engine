[project]
name = "study-engine"
version = "0.1.0"
description = "Exam-prep engine for Claude Code: your courses' slides, recordings (transcribed), exercises and past exams become an exam-focused study system with a knowledge vault."
readme = "README.md"
license = "MIT"
authors = [{ name = "moubipoch" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pymupdf>=1.28.2",
    "faster-whisper>=1.2.1",
    "yt-dlp[default]>=2026.8.19",
    "tree-sitter>=0.26.0",
    "tree-sitter-cpp>=0.23.4",
    "pillow>=10.3",
    "nicegui>=3.18.0",
    "latex2mathml>=3.81.1",
    "fastembed>=0.9.0",
    "imageio-ffmpeg>=0.6.0",
    "deno>=2.9.7",
    "fsrs>=6.3.2",
    "genanki>=0.13.1",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "coursesync @ git+https://github.com/moubipoch/coursesync",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]   # CUDA libs for GPU transcription

[project.scripts]
study = "study.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["study"]

[tool.pytest.ini_options]
testpaths = ["tests"]

